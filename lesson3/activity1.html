<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Superhero Card</title>
<style> 
 body {

background-color: rgb(139, 83, 0);

color: white;

font-family: Arial, sans-serif;

}

   .hero-name {

font-size: 60px;

font-weight: bold;

color: rgb(255, 115, 0);

text-shadow: 3px 3px orange;

}
.tagline {

font-style: italic;

color: rgb(182, 173, 230);

text-transform: capitalize;

 font-weigt: bold
}
.label {

text-transform: uppercase;

text-decoration: underline;

color: coral;

}
.power {

font-weight: bold;

color: lightgreen;

}
.weakness {

text-decoration: line-through;

color: rgb(241, 13, 13);

}
.badge {

font-size: 28px;

font-weight: bold;

color: #ffd900;

transform: rotate(15deg);

}
/* Typography — footer text */

.made-by {

color: rgb(7, 245, 185);

font-style: italic;
text-decoration: underline
}

</style>
</head>

<body>

<h1 class="hero-name">Thunder Kid</h1>

<p class="tagline">the most powerful hero in the school</p>

<h2 class="label"><p class="badge">Top Hero</p>super powers</h2>

<p class="power">Can run faster than a cheetah</p>

<p class="power">Can lift a school bus</p>

<h2 class="label">weaknesses</h2>

<p class="weakness">Maths homework</p>

<p class="weakness">Broccoli</p>



<p class="made-by">Created by humayu</p>

</body>

</html>
